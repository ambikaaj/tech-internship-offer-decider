<title>Tech Internship Offer Decider</title>
<style>
:root{

}
@media (prefers-color-scheme: dark){
  :root{
    --page:#0d0d0d; --card:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --pos:#3987e5; --neg:#e66767; --accent:#3987e5;

  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
header{padding:20px 28px 0;max-width:1080px;margin:0 auto}
header h1{margin:0;font-size:22px}
header p{margin:4px 0 0;color:var(--ink2)}
nav{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--border)}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:inherit;color:var(--ink2);cursor:pointer}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1080px;margin:0 auto;padding:20px 28px 60px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:16px}
h2{font-size:18px;margin:0 0 8px} h3{font-size:15px;margin:16px 0 6px}
.muted{color:var(--muted)} .ink2{color:var(--ink2)} .small{font-size:13px}
button.primary,button.secondary{font:inherit;border-radius:8px;padding:9px 16px;cursor:pointer}
button.primary{background:var(--accent);color:var(--btn-ink);border:1px solid var(--accent)}
button.secondary{background:transparent;color:var(--ink);border:1px solid var(--axis)}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.progress{height:6px;background:var(--grid);border-radius:3px;overflow:hidden;margin:6px 0 14px}
.progress>div{height:100%;background:var(--accent)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opt{border:1px solid var(--border);border-radius:10px;padding:14px 16px;background:var(--card)}
.opt h3{margin:0 0 10px;font-size:17px}
.attr{display:flex;justify-content:space-between;gap:10px;padding:6px 8px;border-radius:6px}
.attr span:first-child{color:var(--ink2)} .attr span:last-child{text-align:right;font-weight:500}
.attr.diff{background:var(--hl)}
.opt button{width:100%;margin-top:12px}
.opt button.mini{width:auto;margin:0;padding:0 7px;line-height:1.6}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
th{color:var(--ink2);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--axis);border-radius:6px;padding:5px 7px}
input[type=number]{width:90px}
.offer{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.offer .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 14px}
.offer label{display:flex;flex-direction:column;font-size:12.5px;color:var(--ink2);gap:3px}
.callout{border-left:3px solid var(--accent);padding:8px 12px;background:var(--hl);border-radius:4px;margin:10px 0}
.warn{border-left-color:var(--neg)}
.tablewrap{overflow-x:auto}
.datatable td:first-child{width:22%}
.datatable td:nth-child(4){white-space:nowrap}
.datatable td:nth-child(4) .small{white-space:normal}
.kbd{border:1px solid var(--axis);border-radius:4px;padding:0 5px;font-size:12px}
/* diverging bar chart */
.chart{position:relative}
.cgroup{margin:10px 0 2px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.crow{display:grid;grid-template-columns:200px 1fr 90px;align-items:center;gap:10px;height:26px}
.crow .lab{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .val{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right}
.track{position:relative;height:100%}
.track .zero{position:absolute;top:2px;bottom:2px;width:1px;background:var(--axis)}
.track .bar{position:absolute;top:7px;height:12px}
.track .bar.pos{background:var(--pos);border-radius:0 4px 4px 0}
.track .bar.neg{background:var(--neg);border-radius:4px 0 0 4px}
.track .hit{position:absolute;inset:0;cursor:default}
.crow:hover .lab{font-weight:600}
#tip{position:fixed;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--axis);border-radius:6px;padding:6px 9px;font-size:12.5px;box-shadow:0 2px 8px rgba(0,0,0,.15);display:none;z-index:10;max-width:280px}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink2);margin:4px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--axis);color:var(--ink2)}
@media (max-width:700px){.pair{grid-template-columns:1fr}.crow{grid-template-columns:120px 1fr 70px}}
</style>
</head>

  const n = M.length, A = M.map((r, i) => { const a = new Float64Array(2 * n); a.set(r); a[n + i] = 1; return a; });
  for (let c = 0; c < n; c++) {
    let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    [A[c], A[p]] = [A[p], A[c]];
    const pv = A[c][c]; for (let k = 0; k < 2 * n; k++) A[c][k] /= pv;
    for (let r = 0; r < n; r++) if (r !== c && A[r][c]) {
      const f = A[r][c]; for (let k = 0; k < 2 * n; k++) A[r][k] -= f * A[c][k];
    }
  }
  return A.map(r => r.slice(n));
}
function fit(obs) {
  let w = Float64Array.from(PRIOR_MU), S;
  for (let it = 0; it < 30; it++) {
    const A = Array.from({length: DIM}, (_, i) => { const r = new Float64Array(DIM); r[i] = 1 / PRIOR_VAR[i]; return r; });
    const g = new Float64Array(DIM);
    for (let i = 0; i < DIM; i++) g[i] = -(w[i] - PRIOR_MU[i]) / PRIOR_VAR[i];
    for (const o of obs) {
      const p = sig(dot(w, o.d)), r = o.y - p, c = p * (1 - p);
      for (const i of o.nz) { g[i] += r * o.d[i]; for (const j of o.nz) A[i][j] += c * o.d[i] * o.d[j]; }
    }
    S = invert(A);
    let mx = 0;
    const step = S.map(row => dot(row, g));
    for (let i = 0; i < DIM; i++) { w[i] += step[i]; mx = Math.max(mx, Math.abs(step[i])); }
    if (mx < 1e-7) break;
  }
  return {w, S};
}

/* =====================================================================
   STATE (saved in this browser's localStorage)
   ===================================================================== */
const BLIND_N = 20, RISK_SCEN = 2, RISK_STEPS = 3, BRAND_N = 10;
const TOTAL_Q = 3 + BLIND_N + 1 + RISK_SCEN * (RISK_STEPS + 1) + BRAND_N;
const STORE = 'tech-internship-decider-v1', OLD_STORE = 'pm-offer-decider-v1';   // old name still read so earlier answers carry over
const freshState = () => ({tab: 'quiz', phase: 'intro', international: null, funcs: null, ranking: null, answers: [], risk: [], fallback: null, q: null, offers: []});
let state = load();
refreshPool();
function load() { try { return Object.assign(freshState(), JSON.parse(localStorage.getItem(STORE) || localStorage.getItem(OLD_STORE)) || {}); } catch { return freshState(); } }
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch {} }

const modelCache = {};
function model(includeBrand) {
  const sig_ = includeBrand + ':' + JSON.stringify(state.ranking) + JSON.stringify(state.funcs) + JSON.stringify(state.answers.map(a => [a.a, a.b, a.y, a.brand]));
  if (modelCache[includeBrand] && modelCache[includeBrand].sig === sig_) return modelCache[includeBrand].m;
  const obs = [];
  for (const a of state.answers) {
    if (a.brand && !includeBrand) continue;
    const A = getOffer(a.a), B = getOffer(a.b);
    if (!A || !B) continue;
    const d = sub(feat(A, a.brand), feat(B, a.brand));
    obs.push({d, nz: nzIdx(d), y: a.y});
  }
  const m = fit(obs);
  modelCache[includeBrand] = {sig: sig_, m};
  return m;
}
const score = (o, w, brand) => dot(w, feat(o, brand));

/* =====================================================================
   QUESTION SELECTION
   ===================================================================== */
const pairKey = (a, b) => [a, b].sort().join('|');
function usedPairs() { return new Set(state.answers.map(a => pairKey(a.a, a.b))); }
function companyCounts(brandPhase) {
  const n = {};
  for (const a of state.answers) if (!!a.brand === brandPhase)
    for (const k of [a.a, a.b]) { const o = getOffer(k); if (o) n[o.coIdx] = (n[o.coIdx] || 0) + 1; }
  return n;
}
function shuffleAB(a, b) { return Math.random() < 0.5 ? [a, b] : [b, a]; }

function nextBlindPair() {
  const {w, S} = model(true), used = usedPairs(), cnt = companyCounts(false);
  let best = null, bestScore = -1;
  for (let i = 0; i < POOL.length; i++) for (let j = i + 1; j < POOL.length; j++) {
    const a = POOL[i], b = POOL[j];
    if (used.has(pairKey(a.key, b.key))) continue;
    if ((cnt[a.coIdx] || 0) >= 2 || (cnt[b.coIdx] || 0) >= 2) continue;
    const d = sub(feat(a, false), feat(b, false));
    const v = quad(d, S);
    if (v < 1e-9) continue;
    const p = sig(dot(w, d));
    const s = p * (1 - p) * v * (0.75 + 0.5 * Math.random());
    if (s > bestScore) { bestScore = s; best = [a.key, b.key]; }
  }
  return best && shuffleAB(...best);
}

function nextBrandPair() {
  const full = model(true), blind = model(false), used = usedPairs(), cnt = companyCounts(true);
  // Each company appears at most twice per 10 brand questions, so extra rounds don't run dry.
  const cap = 2 + Math.floor(state.answers.filter(a => a.brand).length / 10) * 2;
  let best = null, bestScore = -1;
  for (let i = 0; i < POOL.length; i++) for (let j = i + 1; j < POOL.length; j++) {
    let a = POOL[i], b = POOL[j];
    if (a.coIdx === b.coIdx || Math.abs(appeal(a) - appeal(b)) < 0.5) continue;
    if (used.has(pairKey(a.key, b.key))) continue;
    if ((cnt[a.coIdx] || 0) >= cap || (cnt[b.coIdx] || 0) >= cap) continue;
    if (appeal(a) > appeal(b)) [a, b] = [b, a]; // a = less famous, or lower in your ranking
    // Stress test: the lesser-known name should win on everything else.
    const pLesser = sig(score(a, blind.w, false) - score(b, blind.w, false));
    if (pLesser < 0.55 || pLesser > 0.92) continue;
    const d = sub(feat(a, true), feat(b, true));
    const p = sig(dot(full.w, d));
    const s = p * (1 - p) * quad(d, full.S) * (0.75 + 0.5 * Math.random());
    if (s > bestScore) { bestScore = s; best = [a.key, b.key]; }
  }
  return best && shuffleAB(...best);
}

// The in-hand offer A comes from the middle of your ranking and B from near the top,
// so B is clearly better and the answer isn't swamped by small errors in the model.
function pickRiskPair(k, avoid = []) {
  const {w} = model(false);
  const ranked = [...POOL].sort((a, b) => score(a, w, false) - score(b, w, false));
  const band = (lo, hi) => ranked.slice(Math.floor(lo * ranked.length), Math.ceil(hi * ranked.length));
  const [aBand, bBand] = [[band(0.45, 0.6), band(0.88, 1)], [band(0.25, 0.4), band(0.72, 0.85)]][k];
  const prior = new Set(state.risk.flatMap(r => [getOffer(r.a).coIdx, getOffer(r.b).coIdx]));
  avoid.forEach(key => prior.add(getOffer(key).coIdx));
  const hits = [];
  for (const a of aBand) for (const b of bBand)
    if (a.coIdx !== b.coIdx && !prior.has(a.coIdx) && !prior.has(b.coIdx)) hits.push([a.key, b.key]);
  if (!hits.length) hits.push([aBand[0].key, bBand[bBand.length - 1].key]);
  return hits[Math.floor(Math.random() * hits.length)];
}

// "Answer 5 more" raises the target past BRAND_N.
const brandTarget = () => Math.max(BRAND_N, state.brandTarget || 0);
const totalQ = () => TOTAL_Q + brandTarget() - BRAND_N
  + state.risk.reduce((n, r) => n + Math.max(0, r.steps.length - RISK_STEPS), 0); // risk follow-ups asked so far
function advance() {
  const nBlind = state.answers.filter(a => !a.brand).length;
  const nBrand = state.answers.filter(a => a.brand).length;
  if (state.phase === 'blind' && nBlind >= BLIND_N) state.phase = 'fallback';
  if (state.phase === 'fallback' && state.fallback != null) state.phase = 'risk';
  if (state.phase === 'risk') {
    const cur = state.risk[state.risk.length - 1];
    if (!cur || scenarioDone(cur)) {
      if (state.risk.length >= RISK_SCEN) state.phase = 'brand';
      else { const [a, b] = pickRiskPair(state.risk.length); state.risk.push({a, b, gap: null, lo: 0, hi: 100, steps: []}); }
    }
  }
  if (state.phase === 'brand' && nBrand >= brandTarget()) state.phase = 'done';
  state.q = null;
  if (state.phase === 'blind') { const p = nextBlindPair(); if (p) state.q = {a: p[0], b: p[1], brand: false}; else state.phase = 'fallback'; }
  if (state.phase === 'brand') { const p = nextBrandPair(); if (p) state.q = {a: p[0], b: p[1], brand: true}; else state.phase = 'done'; }
  save();
}
// Undo: snapshot the quiz before every answer; Back restores the latest snapshot.
const QUIZ_KEYS = ['phase', 'answers', 'risk', 'fallback', 'q', 'international', 'funcs', 'ranking', 'brandTarget'];
function checkpoint() {
  const snap = {};
  for (const k of QUIZ_KEYS) snap[k] = state[k] === undefined ? null : JSON.parse(JSON.stringify(state[k]));
  state.history = (state.history || []).concat([snap]).slice(-60);
}
function goBack() {
  const snap = (state.history || []).pop();
  if (!snap) return;
  for (const k of QUIZ_KEYS) state[k] = snap[k];
  refreshPool(); save(); render();
}
const backBtn = () => state.history && state.history.length ? '<button class="secondary" id="back" title="Undo your last answer (Backspace)">← Back</button>' : '';
function answerPair(y) { checkpoint(); state.answers.push({a: state.q.a, b: state.q.b, y, brand: state.q.brand}); advance(); render(); }
function riskP(r) { return Math.round((r.lo + r.hi) / 2); }
function answerGap(gap) { checkpoint(); state.risk[state.risk.length - 1].gap = gap; save(); render(); }
function answerRisk(wait) {
  checkpoint();
  const r = state.risk[state.risk.length - 1], p = riskP(r);
  r.steps.push({p, wait});
  if (wait) r.hi = p; else r.lo = p;   // waiting at p% means your threshold is at or below p
  advance(); render();
}

/* =====================================================================
   RISK MODEL
   Everything is in dollars of monthly pay, measured from your safety net
   (back to spring recruiting with nothing = $0). A typical offer sits at
   +L (your safety-net answer); offer B in a scenario sits at +L + gap
   (your gap answer). A risk curve g_r turns dollars into satisfaction:
   r > 0 = risk-averse, r = 0 = neutral, r < 0 = risk-seeking (per $10k).
   r is fit to the odds at which you'd let a sure offer expire. It uses
   only your own answers, not the preference model, so it stays stable.
   ===================================================================== */
const FALLBACK = [
  {v: 2000, label: 'A little worse', desc: 'than taking a typical offer: about like that offer paying $2,000/month less.'},
  {v: 5000, label: 'Clearly worse', desc: 'about like a typical offer paying $5,000/month less.'},
  {v: 10000, label: 'Much worse', desc: 'about like doing a typical internship for free.'},
  {v: 20000, label: 'A disaster', desc: 'I really need an internship lined up. Worse than giving up a whole summer\'s pay.'},
];
const GAPS = [500, 1000, 2000, 3000, 5000];
const fallbackD = () => FALLBACK[state.fallback == null ? 1 : state.fallback].v;
const g = (x, r) => Math.abs(r) < 1e-6 ? x / 1e4 : (1 - Math.exp(-r * x / 1e4)) / r;

function fitRisk() {
  const L = fallbackD();
  const pts = state.risk.filter(r => r.steps.length && r.gap).map(r =>
    ({L, G: r.gap, target: Math.min(0.995, Math.max(0.005, (r.lo + r.hi) / 200))}));
  if (!pts.length) return null;
  const logit = p => Math.log(p / (1 - p));
  let best = 0, bestErr = Infinity;
  for (let r = -4; r <= 8.0001; r += 0.05) {
    let err = 0;
    for (const p of pts) {
      const pred = Math.min(0.99, Math.max(0.01, g(p.L, r) / g(p.L + p.G, r)));
      err += (logit(pred) - logit(p.target)) ** 2;
    }
    err += 0.005 * r * r; // slight pull toward neutral when answers are ambiguous
    if (err < bestErr) { bestErr = err; best = r; }
  }
  return {r: best, pts};
}
// A scenario normally takes RISK_STEPS answers. If you keep taking the sure offer (or keep
// waiting), keep going toward 97% (or 3%) so very cautious or very bold answers aren't cut off.
function scenarioDone(s) {
  if (s.steps.length < RISK_STEPS) return false;
  const extreme = (s.hi === 100 && s.lo >= 85) || (s.lo === 0 && s.hi <= 15);
  return !extreme || s.steps.length >= RISK_STEPS + 2;
}
// Overall caution: the odds you'd need to give up a sure, typical offer for one worth
// $2,000/month more. Combines how bad "no offer" is for you with your risk curve.
function caution(r) {
  const L = fallbackD(), pct = Math.round(100 * Math.min(0.995, g(L, r) / g(L + 2000, r)));
  const label = pct >= 90 ? 'Very cautious' : pct >= 75 ? 'Cautious' : pct >= 55 ? 'Balanced' : 'Bold';
  return {pct, label};
}
function riskLabel(r) {
  if (r == null) return 'Not measured yet';
  if (r < -0.75) return 'Risk-seeking';
  if (r < 1) return 'Roughly risk-neutral';
  if (r < 3) return 'Moderately risk-averse';
  return 'Strongly risk-averse';
}

  if (state.phase === 'visa') {
    m.innerHTML = `<div class="card"><h2>First: are you an international student?</h2>
      <p class="ink2">If you'll need visa sponsorship to work in the US, the tool removes companies that don't sponsor (per our compiled sponsorship list) and flags ones with limited sponsorship.</p>
      <div class="row"><button class="primary" data-intl="1">Yes, I'll need sponsorship</button><button class="primary" data-intl="0">No, I'm authorized to work in the US</button></div></div>

    if ($('#back')) $('#back').onclick = goBack;
    m.querySelectorAll('[data-intl]').forEach(b => b.onclick = () => setInternational(b.dataset.intl === '1', 'track'));
    return;
  }
  if (state.phase === 'track') {
    const sel = state.funcsDraft || (state.funcsDraft = (state.funcsPicked || chosenFuncs()).slice());
    m.innerHTML = `<div class="card"><h2>Which kinds of roles are you recruiting for?</h2>
      <p class="ink2">Pick all that apply. The rest of the quiz, your profile and your company list only use these role types. You can change this later on the Compare my offers tab.</p>
      <div style="display:grid;gap:8px;margin:12px 0">${FN.map(f => { const n = funcCounts(f), on = sel.includes(f);
        return `<button class="${on ? 'primary' : 'secondary'}" data-fn="${f}" aria-pressed="${on}" style="text-align:left;display:flex;justify-content:space-between;gap:10px">
          <span>${on ? '✓ ' : ''}<b>${esc(FUNCS[f])}</b></span><span class="small">${n.roles} roles at ${n.cos} companies</span></button>`; }).join('')}</div>

      <p class="small muted">Role counts are for US internships${state.international ? ' at companies that may sponsor visas' : ''}. PM roles come from our core company list and web research; the other types come from the public MBA Tech Internships 2027 tracker, so the PM list is the most complete.</p></div>
      <div class="row">${backBtn()}</div>`;
    if ($('#back')) $('#back').onclick = () => { delete state.funcsDraft; goBack(); };
    m.querySelectorAll('[data-fn]').forEach(b => b.onclick = () => {
      const f = b.dataset.fn, k = sel.indexOf(f);

  if (!state.q && (state.phase === 'blind' || state.phase === 'brand')) advance();
  const [title, blurb] = PHASE_INTRO[state.phase];
  let body = '';
  if (state.phase === 'blind' || state.phase === 'brand') {
    const A = getOffer(state.q.a), B = getOffer(state.q.b), br = state.q.brand;
    body = `<div class="pair">
      <div class="opt"><h3>${br ? esc(A.name) : 'Company A'}</h3>${attrRows(A, B, br)}<button class="primary" id="ca">Choose ${br ? esc(A.name) : 'A'}</button></div>
      <div class="opt"><h3>${br ? esc(B.name) : 'Company B'}</h3>${attrRows(B, A, br)}<button class="primary" id="cb">Choose ${br ? esc(B.name) : 'B'}</button></div>
    </div><div class="row" style="justify-content:center;margin-top:12px"><button class="secondary" id="tie">Can't decide — they feel equal</button></div>`;
  } else if (state.phase === 'fallback') {
    body = `<p><b>Imagine you let an offer expire, and the offer you were waiting on says no.</b> You're back to spring recruiting with nothing lined up. Compared with just taking a typical offer on the list, how bad is that for you?</p>
      ${FALLBACK.map((f, i) => `<div class="opt" style="margin-bottom:8px"><b>${f.label}</b> — <span class="ink2">${f.desc}</span>
      <button class="secondary" data-fb="${i}" style="width:auto;margin:0 0 0 10px">Choose</button></div>`).join('')}`;
  } else if (state.phase === 'risk') {
    const r = state.risk[state.risk.length - 1], A = getOffer(r.a), B = getOffer(r.b), p = riskP(r);
    const cards = extra => `<div class="pair">
      <div class="opt"><h3>Company A${extra ? ' · <span class="badge">offer in hand, expires in 48 hours</span>' : ''}</h3>${attrRows(A, B, false)}</div>
      <div class="opt"><h3>Company B${extra ? ' · <span class="badge">final rounds done, decision in ~2 weeks</span>' : ''}</h3>${attrRows(B, A, false)}
        ${extra ? `<div class="callout"><b>Your chance of getting B's offer: ${p}%</b></div>` : ''}</div></div>`;
    if (!r.gap) {
      body = `<p>Scenario ${state.risk.length} of ${RISK_SCEN}. First, a warm-up:</p>${cards(false)}

      <div class="row">${GAPS.map(gp => `<button class="secondary" data-gap="${gp}">+${money(gp)}${gp === 5000 ? ' or more' : ''}</button>`).join('')}

    } else {
      body = `<p>Scenario ${state.risk.length} of ${RISK_SCEN}, question ${r.steps.length + 1}${r.steps.length < RISK_STEPS ? ' of ' + RISK_STEPS : ' (one follow-up to pin down your answer)'}. (You said B is worth about ${money(r.gap)}/month more to you.)</p>
      ${cards(true)}
      <p class="ink2">A won't extend. If you let A expire and B says no, you're back to spring recruiting with nothing (you said that's <b>${FALLBACK[state.fallback == null ? 1 : state.fallback].label.toLowerCase()}</b> than a typical offer).</p>
      <div class="row"><button class="primary" id="acc">Accept A now</button><button class="primary" id="wait">Let A expire and wait for B</button></div>`;
    }
  }
  m.innerHTML = `<div class="card"><h2>${title}</h2><p class="ink2">${blurb}</p>${progressBar()}${body}</div>
    <div class="row">${backBtn()}<button class="secondary" id="skip">${state.phase === 'brand' ? 'Finish now' : 'Skip to next part'}</button><button class="secondary" id="reset">Start over</button></div>`;
  const on = (id, f) => { const el = $('#' + id); if (el) el.onclick = f; };
  on('ca', () => answerPair(1)); on('cb', () => answerPair(0)); on('tie', () => answerPair(0.5));
  on('acc', () => answerRisk(false)); on('wait', () => answerRisk(true));
  on('back', goBack);
  document.querySelectorAll('[data-fb]').forEach(b => b.onclick = () => { checkpoint(); state.fallback = +b.dataset.fb; advance(); render(); });
  document.querySelectorAll('[data-gap]').forEach(b => b.onclick = () => {
    const gp = +b.dataset.gap;
    if (gp) answerGap(gp);
    else { // the model got this pair backwards; swap in a different pair
      checkpoint();
      const old = state.risk.pop();
      const [a, bb] = pickRiskPair(state.risk.length, [old.a, old.b]);
      state.risk.push({a, b: bb, gap: null, lo: 0, hi: 100, steps: []}); save(); render();
    }
  });
  on('reset', resetQuiz);
  on('skip', () => {
    checkpoint();
    if (state.phase === 'blind') state.phase = 'fallback';
    else if (state.phase === 'fallback') { state.fallback = 1; state.phase = 'risk'; }
    else if (state.phase === 'risk') { state.phase = 'brand'; }
    else state.phase = 'done';
    advance(); render();
  });
}
function resetQuiz() {

  const offers = state.offers; state = freshState(); state.offers = offers; refreshPool(); save(); render();
}
document.addEventListener('keydown', e => {

/* ---------- profile ---------- */
function payWeight(w) { return Math.max(w[I_PAY], 0.05); }
function profileItems(w) {
  const toD = u => u / payWeight(w) * 1000;
  const centered = (start, keys, labels, skip = []) => {
    const ks = keys.filter(k => !skip.includes(k));
    const mean = ks.reduce((s, k) => s + w[start + keys.indexOf(k)], 0) / ks.length;
    return ks.map(k => ({label: labels[k], d: toD(w[start + keys.indexOf(k)] - mean)}));
  };
  return [
    ...(chosenFuncs().length > 1 ? [{group: 'Role type (vs. your average of the types you picked)', items: centered(I_FN, FN, FUNCS, FN.filter(f => !chosenFuncs().includes(f)))}] : []),
    {group: 'Location (vs. your average location)', items: centered(I_REG, REG, REGIONS, ['intl'])},
    {group: 'Company type (vs. your average)', items: centered(I_SEC, SEC, SECTORS)},
    {group: 'Company stage (vs. your average)', items: centered(I_STG, STG, STAGES)},
    {group: 'Role, security and brand', items: [
      ...(POOL.some(o => o.tech) ? [{label: 'Technical PM role (vs. general PM)', d: toD(w[I_TECH])}] : []),
      ...(POOL.some(o => o.general) ? [{label: 'General MBA posting (PM not guaranteed)', d: toD(w[I_GEN])}] : []),
      {label: '+10 pts return-offer odds', d: toD(w[I_RET])},
      {label: 'One brand tier up (e.g. 2→1)', d: toD(w[I_TIER])},
      {label: 'Your #1 company vs. one you didn\'t rank', d: toD(w[I_RANK])},
    ]},
  ];
}
function divergingChart(groups) {
  const max = Math.max(500, ...groups.flatMap(g => g.items.map(i => Math.abs(i.d))));
  const rows = groups.map(gp => `<div class="cgroup">${gp.group}</div>` + gp.items.map(it => {
    const pct = Math.abs(it.d) / max * 50;
    const pos = it.d >= 0;
    const tip = `${esc(it.label)}: worth ${signedMoney(it.d)}/month in pay to you`;
    return `<div class="crow"><div class="lab" title="${esc(it.label)}">${esc(it.label)}</div>
      <div class="track"><div class="zero" style="left:50%"></div>
      <div class="bar ${pos ? 'pos' : 'neg'}" style="${pos ? 'left:50%' : 'right:50%'};width:calc(${pct}% - 1px)"></div>
      <div class="hit" data-tip="${tip}"></div></div>
      <div class="val">${signedMoney(it.d)}</div></div>`;
  }).join('')).join('');
  const table = `<details><summary class="small ink2">Show as table</summary><table><tr><th>Factor</th><th class="num">$/month equivalent</th></tr>
    ${groups.flatMap(gp => gp.items.map(it => `<tr><td>${esc(it.label)}</td><td class="num">${signedMoney(it.d)}</td></tr>`)).join('')}</table></details>`;
  return `<div class="legend"><span><i style="background:var(--pos)"></i>Worth extra pay to you</span><span><i style="background:var(--neg)"></i>You'd need extra pay to accept</span></div>
    <div class="chart">${rows}</div>${table}`;
}
function wireTips() {
  const tip = $('#tip');
  document.querySelectorAll('[data-tip]').forEach(el => {
    el.onmousemove = e => { tip.textContent = el.dataset.tip; tip.style.display = 'block'; tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; };
    el.onmouseleave = () => { tip.style.display = 'none'; };
  });
}

function stressTest() {
  // Compare brand-phase choices with what the blind-only model predicted.
  const blind = model(false);
  return state.answers.filter(a => a.brand && a.y !== 0.5 && getOffer(a.a) && getOffer(a.b)).map(a => {
    const A = getOffer(a.a), B = getOffer(a.b);
    const pA = sig(score(A, blind.w, false) - score(B, blind.w, false));
    const chosen = a.y === 1 ? A : B, other = a.y === 1 ? B : A;
    const predicted = pA >= 0.5 ? A : B;
    return {chosen, other, flipped: predicted !== chosen, conf: Math.max(pA, 1 - pA)};
  });
}

// Your stated ranking vs. how the same companies rank on what you value with names hidden.
function rankingCard(w) {
  const list = state.ranking || [];
  if (list.length < 2) return '';
  const rows = list.map((id, k) => {
    const c = COMPANIES.find(c => c.id === id);
    const offers = POOL.filter(o => o.coIdx === c.idx);
    const best = offers.length ? Math.max(...offers.map(o => score(o, w, false))) : -Infinity;
    return {c, stated: k + 1, best};
  });
  const order = [...rows].sort((a, b) => b.best - a.best);
  rows.forEach(r => { r.valued = order.indexOf(r) + 1; });
  const gaps = rows.filter(r => Math.abs(r.valued - r.stated) >= 3);
  return `<div class="card"><h2>Your ranking vs. what you value</h2>
    <p class="ink2">Your ranking from step 1, next to how the same companies rank on pay, location, company type, stage and return odds, using what your blind answers say you value (best location for each).</p>
    ${gaps.length ? `<p>${gaps.length} compan${gaps.length === 1 ? 'y' : 'ies'} moved 3 or more places. Ask yourself what you know about ${gaps.length === 1 ? 'it' : 'them'} that these factors miss (team, mission, people you've met), or whether it's mostly the name.</p>`
      : '<p>Your ranking lines up with what you value. Nice consistency.</p>'}
    <table><tr><th class="num">Your rank</th><th>Company</th><th class="num">Rank on what you value</th><th></th></tr>
    ${rows.map(r => { const d = r.stated - r.valued;
      return `<tr><td class="num">${r.stated}</td><td>${esc(r.c.name)}</td><td class="num">${r.valued}</td>
      <td class="small ink2">${d >= 3 ? `▲ scores better than you ranked it` : d <= -3 ? `▼ you rank it higher than it scores` : ''}</td></tr>`; }).join('')}</table></div>`;
}

// Answers live only in this browser, so students keep a copy to reload when an offer arrives.
const PROFILE_SAVE_CARD = `<div class="card"><h2>Save your profile for when offers arrive</h2>

    <input type="file" id="imp" accept=".json" style="display:none"></div></div>`;
function wireProfileFile() {
  const exp = $('#exp');
  if (exp) exp.onclick = () => {

function renderProfile() {
  const m = $('#main');
  const nAns = state.answers.length;
  if (!nAns) {
    m.innerHTML = `<div class="card"><h2>No answers yet</h2><p>Take the preference quiz first, or load a profile you saved earlier.</p>
      <div class="row"><button class="primary" id="g">Go to quiz</button><button class="secondary" id="impbtn">Load my saved profile</button><input type="file" id="imp" accept=".json" style="display:none"></div></div>`;
    $('#g').onclick = () => { state.tab = 'quiz'; save(); render(); }; wireProfileFile(); return;
  }
  const {w} = model(true);

  const ranked = POOL.map(o => ({o, s: score(o, w, true), sb: score(o, w, false)}));

  let riskHtml = '<p class="muted">Finish step 3 of the quiz to measure this.</p>';
  if (risk) {
    const c = caution(risk.r), L = fallbackD();
    const neutral = Math.round(100 * L / (L + 2000));
    const answered = state.risk.filter(s => s.steps.length);
    const neverWaited = answered.length && answered.every(s => s.steps.every(st => !st.wait));
    const alwaysWaited = answered.length && answered.every(s => s.steps.every(st => st.wait));
    riskHtml = `<p><span class="badge">${c.label}</span>
      To give up a sure, typical offer for one worth $2,000/month more, you'd need about <b>${c.pct}%</b> odds of getting it.

        <li><b>Extra caution about risk itself.</b> ${risk.r >= 3 ? 'Strong: you pay a big premium for certainty on top of that.' : risk.r >= 1 ? 'Moderate: you add a premium for certainty on top of that.' : risk.r <= -0.75 ? 'None. You lean toward gambling for the better outcome.' : 'Little. Your caution comes mostly from the point above.'}</li></ul>
      <p class="ink2">${c.pct >= 75 ? 'The tool will lean toward accepting an exploding offer unless your odds on the alternative are very strong.' : c.pct < 55 ? 'The tool will lean toward waiting when the upside is big.' : 'The tool weighs accepting and waiting fairly evenly, based on your odds.'}</p>
      <p class="small muted">Technical: safety net = ${money(L)}/month below a typical offer; risk curve r = ${risk.r.toFixed(2)} (0 = neutral, higher = more averse).</p>`;
  }

  ${PROFILE_SAVE_CARD}
  <div class="card"><h2>What each factor is worth to you</h2>

        '<p>Your blind preferences held up: names and your ranking didn\'t override them.</p>'}
      ${coPull.length ? `<h3>Companies with a pull beyond their brand tier</h3><p class="small">${coPull.map(x => `${esc(x.c.name)} ${signedMoney(x.d)}/mo`).join(' · ')}</p>` : ''}`
      : '<p class="muted">Finish Part 3 of the quiz to see how much brand names move you.</p>'}
  </div>
  <div class="card"><h2>Your top 10 internships</h2>
    <table><tr><th>#</th><th>Company</th><th>Role</th><th>Location</th><th class="num">Est. pay</th><th class="num">Rank with names hidden</th></tr>
    ${byFull.slice(0, 10).map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.o.name)}</td><td class="small">${esc(r.o.title)}</td><td>${esc(r.o.city)}</td><td class="num">${money(r.o.pay)}</td><td class="num">${blindRank.get(r.o.key)}</td></tr>`).join('')}</table>
  </div>`;

}
function tradeoffText(chosen, other) {
  const bits = [];
  if (other.pay > chosen.pay) bits.push(`${money(other.pay - chosen.pay)}/mo pay`);
  if (other.ret > chosen.ret) bits.push(`${other.ret - chosen.ret} pts return-offer odds`);
  if (other.region !== chosen.region) bits.push(`${REGIONS[other.region]} instead of ${REGIONS[chosen.region]}`);
  if (other.sector !== chosen.sector) bits.push(`${SECTORS[other.sector]} work`);
  if (!other.general && funcText(other) !== funcText(chosen)) bits.push(`a ${FUNCS[other.funcs[0]].toLowerCase()} role`);
  return bits.join(', ') || 'a mix of smaller factors';
}

/* ---------- compare my offers ---------- */
function blankOffer() {
  const c = COMPANIES[0];
  return {co: c.id, loc: 0, role: 0, name: '', city: '', region: 'bay', sector: c.sector, stage: c.stage, tier: c.tier,
    tech: false, pay: c.roles[0].pay, ret: c.ret, status: 'inhand', deadline: '', expected: ''};
}
// Role type for an offer at a company not on the list ("tech" was saved by older versions).
const OTHER_RTYPES = {pm: 'Product manager', tpm: 'Technical PM', strategy: FUNCS.strategy, finance: FUNCS.finance, pmm: FUNCS.pmm};
const otherRtype = of => of.rtype || (of.tech === true || of.tech === 'true' ? 'tpm' : 'pm');
const otherFunc = of => otherRtype(of) === 'tpm' ? 'pm' : otherRtype(of);
// Roles at this company that are offered in the chosen location.
const rolesAt = (c, loc) => c.roles.map((r, j) => ({r, j})).filter(({r}) => !r.locs || r.locs.includes(+loc));
function offerObj(of) {
  const c = COMPANIES.find(c => c.id === of.co);
  const r = c && c.roles[+of.role || 0];
  return {
    key: 'user', coIdx: c ? c.idx : null, name: c ? c.name : (of.name || 'Other company'),
    city: c ? c.locs[of.loc].city : (of.city || REGIONS[of.region]), region: c ? c.locs[of.loc].region : of.region,
    sector: c ? c.sector : of.sector, stage: c ? c.stage : of.stage, tier: c ? c.tier : +of.tier,
    title: r ? r.title : FUNCS[otherFunc(of)], funcs: r ? r.funcs : [otherFunc(of)],
    tech: r ? !!r.tech : otherRtype(of) === 'tpm', general: r ? !!r.general : false,
    pay: +of.pay || 0, ret: c ? c.ret : STAGE_RET[of.stage] || 50,
  };
}
function roleNote(c, r) {
  const src = r.src && r.src.url ? ` <a href="${esc(r.src.url)}" target="_blank" rel="noopener">${r.tracker ? 'posting' : 'source'}</a>` : '';
  const status = r.status === 'expected' ? '<b>Expected:</b> not posted yet for 2027. ' : r.status === 'closed' ? '<b>Posting closed.</b> ' : '';
  const visa = state.international && r.sponsorship === 'no' && c.sponsor !== 'no' ? '<b>This posting says no visa sponsorship.</b> ' : '';

function renderResults() {
  const {w} = model(true);
  const risk = fitRisk();
  const r = risk ? risk.r : 1;
  // x = dollars/month above the safety net: a typical (median) offer on the list sits at +L.
  const med = POOL.map(o => score(o, w, true)).sort((a, b) => a - b)[Math.floor(POOL.length / 2)];
  const L = fallbackD();
  const toX = sc => L + (sc - med) / payWeight(w) * 1000;
  const toD = u => u / payWeight(w) * 1000;
  const list = state.offers.map((of, i) => {
    const o = offerObj(of);
    return {i, of, o, s: score(o, w, true), sb: score(o, w, false), x: toX(score(o, w, true))};
  });
  const ranked = [...list].sort((a, b) => b.s - a.s);
  const blindRanked = [...list].sort((a, b) => b.sb - a.sb);
  const label = it => `Offer ${it.i + 1} (${esc(it.o.name)})`;
  let html = `<div class="card"><h2>Ranking</h2><table><tr><th>#</th><th>Offer</th><th>Status</th><th class="num">Value vs. #1, in $/month</th></tr>
    ${ranked.map((it, k) => `<tr><td>${k + 1}</td><td>${label(it)} · ${esc(it.o.city)}</td>
      <td>${it.of.status === 'inhand' ? 'In hand' + (it.of.deadline ? ', due ' + it.of.deadline : '') : 'Waiting to hear'}</td>
      <td class="num">${k === 0 ? 'top choice' : signedMoney(toD(it.s - ranked[0].s))}</td></tr>`).join('')}</table>`;

  if (ranked.length >= 2) {
    const [a, b] = ranked, fa = feat(a.o, true), fb = feat(b.o, true);
    const parts = [
      ['Pay', [I_PAY]], ['Return-offer odds', [I_RET]], ['Location', range(I_REG, REG.length)],
      ['Company type', range(I_SEC, SEC.length)], ['Stage', range(I_STG, STG.length)], ['Role type', [...range(I_FN, FN.length), I_TECH, I_GEN]], ['Brand and your ranking', [I_TIER, I_RANK, ...range(I_CO, COMPANIES.length)]],
    ].map(([n, idx]) => [n, toD(idx.reduce((s, k) => s + w[k] * (fa[k] - fb[k]), 0))]).filter(([, d]) => Math.abs(d) >= 50);
    const gap = toD(a.s - b.s);
    html += `<h3>Why ${esc(a.o.name)} beats ${esc(b.o.name)}</h3>
      <p>${parts.map(([n, d]) => `${n}: <b>${signedMoney(d)}</b>`).join(' · ') || 'They\'re nearly identical for you.'}</p>
      <p class="ink2">It would flip if ${esc(b.o.name)} paid about <b>${money(gap)}/month</b> more${gap > 4000 ? ' (more than any realistic negotiation)' : gap < 500 ? ' — this is close, so trust your gut or negotiate' : ''}.</p>`;
    if (blindRanked[0].i !== ranked[0].i)
      html += `<div class="callout warn"><b>Brand or your company ranking is deciding this.</b> With names hidden you'd rank ${label(blindRanked[0])} first. Make sure the name is worth what you give up.</div>`;
  }
  html += '</div>';
  html += explodingAnalysis(list, r, risk, toD, w);
  $('#results').innerHTML = html;
}
const range = (s, n) => Array.from({length: n}, (_, i) => s + i);

const RENEGE_NOTE = `<div class="callout warn"><b>Reneging is unacceptable.</b> Once you accept an offer, it's final: don't keep interviewing and back out for something better.
  Reneging ruins future Wharton students' chances at that company, because firms cut back or stop recruiting at schools where students renege.
  Only accept an offer you're ready to honor.</div>`;

// Nobody can predict their odds of an offer, so instead of asking, this works out how sure
// you'd need to be (given your risk answers) before letting the in-hand offer expire.
// Reported in web research (from Wharton's 2025–26 recruiting calendar); not verified against MBACM directly.
const OFFER_RULE_NOTE = `<div class="callout small"><b>Wharton's offer-deadline rule</b> (reported for 2025–26; confirm the 2026–27 rule with MBA Career Management):
  first-year internship offers must stay open until <b>Jan 30 at 5pm ET, or 3 weeks after the written offer, whichever is later</b>. After Feb 20 the minimum is 2 weeks.
  No first-year interviews before Jan 5. If your deadline is shorter than this, talk to MBACM before you decide.</div>`;

function explodingAnalysis(list, r, risk, toD, w) {
  const inHand = list.filter(it => it.of.status === 'inhand');
  const pending = list.filter(it => it.of.status === 'pending');
  if (!inHand.length || !pending.length)
    return `<div class="card"><h2>Exploding offer check</h2><p class="muted">Mark one offer as "in hand" and another as "still waiting" to see whether to accept now or wait.</p></div>`;
  const dated = inHand.filter(it => it.of.deadline).sort((a, b) => a.of.deadline.localeCompare(b.of.deadline));
  const E = dated[0] || inHand[0];
  const others = inHand.filter(it => it !== E);
  const base = Math.max(0, ...others.map(o => o.x));   // 0 = back to spring recruiting
  const label = it => `${esc(it.o.name)} (Offer ${it.i + 1})`;
  const better = pending.filter(it => it.x > E.x).sort((a, b) => b.x - a.x);
  let html = `<div class="card"><h2>Exploding offer: ${label(E)}${E.of.deadline ? `, due ${E.of.deadline}` : ''}</h2>`;
  if (base >= E.x) {
    html += `<p>You already hold a better offer (${others.filter(o => o.x >= E.x).map(label).join(', ')}), so letting ${esc(E.o.name)} expire costs you nothing.</p>`;
  } else if (!better.length) {
    html += `<p class="callout"><b>Accept ${esc(E.o.name)}.</b> None of the offers you're waiting on beat it for you, so waiting only adds risk.</p>`;
  } else {
    const style = risk ? caution(risk.r).label.toLowerCase() : 'not measured yet, so assuming mild risk aversion';
    html += `<p>Nobody can know their odds, so here is how sure you'd need to be, given your risk style (${style}), before letting ${esc(E.o.name)} expire:</p>
      <table><tr><th>Waiting on</th><th class="num">Worth vs. ${esc(E.o.name)}</th><th class="num">You'd need to be at least</th><th>In practice</th></tr>
      ${better.map(it => {
        const need = Math.round(100 * Math.min(1, Math.max(0, (g(E.x, r) - g(base, r)) / (g(it.x, r) - g(base, r)))));
        const advice = need >= 90 ? 'Accept now, unless they\'ve told you an offer is coming'
          : need >= 70 ? 'Only wait with strong signals (e.g. the recruiter says you\'re their top pick)'
          : 'Waiting is reasonable if your final rounds went well';
        return `<tr><td>${label(it)}</td><td class="num">${signedMoney(it.x - E.x)}/mo</td>
          <td class="num"><b>${need}% sure</b></td><td>${advice}</td></tr>`;
      }).join('')}</table>
      <p class="small muted">${better.length > 1 ? 'Each row assumes that is the only offer you\'re waiting on; waiting on several at once makes waiting a little safer. ' : ''}A high bar means ${esc(E.o.name)} is close in value or ending up with nothing would hurt a lot.</p>`;
    const early = pending.filter(it => it.of.expected && E.of.deadline && it.of.expected <= E.of.deadline);
    if (early.length) html += `<p class="ink2">You expect to hear from ${early.map(label).join(', ')} before this deadline, so you may not have to gamble at all.</p>`;
  }
  const chase = better[0] || pending[0];
  html += `${OFFER_RULE_NOTE}${RENEGE_NOTE}<h3>Before you decide</h3><ul class="small">
    <li><b>Ask for an extension.</b> Tell ${esc(E.o.name)} you're excited and finishing other processes, and ask for a specific new date. Many firms grant a week or two.</li>
    <li><b>Ask the other firm to speed up.</b> Tell ${esc(chase.o.name)} you have an offer with a deadline. It's normal, and they often can. Their answer is also your best signal of where you stand.</li></ul></div>`;
  return html;
}

/* =====================================================================
   SELF-TEST (open decider.html#selftest): a simulated student with known
   preferences takes the whole quiz; checks the model recovers them.
   ===================================================================== */
function selfTest() {
  const out = {};
  for (let trial = 0; trial < 8; trial++) {
    state = freshState(); refreshPool();
    state.ranking = [...COMPANIES].sort(() => Math.random() - 0.5).slice(0, 8).map(c => c.id);
    state.phase = 'blind'; advance();
    const T = new Float64Array(DIM);
    T[I_PAY] = 0.45; T[I_RET] = 0.2;
    T[I_REG + REG.indexOf('nyc')] = 1.2; T[I_REG + REG.indexOf('sea')] = -0.9;
    T[I_SEC + SEC.indexOf('ai')] = 0.6; T[I_STG + STG.indexOf('startup')] = -0.5;
    T[I_TIER] = 0.5; T[I_RANK] = 1.0;
    const trueR = [3, 0, 6, 1.5][trial % 4], L = FALLBACK[1].v;
    const tScore = (o, br) => dot(T, feat(o, br));
    const tMed = POOL.map(o => tScore(o, false)).sort((a, b) => a - b)[Math.floor(POOL.length / 2)];
    const tX = o => L + (tScore(o, false) - tMed) / T[I_PAY] * 1000; // true $ above the safety net
    let guard = 0;
    while (state.phase !== 'done' && guard++ < 200) {
      if (state.phase === 'fallback') { state.fallback = 1; advance(); continue; }
      if (state.phase === 'risk') {
        const rr = state.risk[state.risk.length - 1], A = getOffer(rr.a), B = getOffer(rr.b), p = riskP(rr) / 100;
        if (!rr.gap) {
          const G = tX(B) - tX(A);
          if (G <= 0) { const old = state.risk.pop(); const [a, b] = pickRiskPair(state.risk.length, [old.a, old.b]); state.risk.push({a, b, gap: null, lo: 0, hi: 100, steps: []}); continue; }
          rr.gap = GAPS.reduce((best, gp) => Math.abs(gp - G) < Math.abs(best - G) ? gp : best); // student picks the nearest button
          continue;
        }
        const wait = p * g(tX(B), trueR) > g(tX(A), trueR);
        rr.steps.push({p: p * 100, wait}); if (wait) rr.hi = p * 100; else rr.lo = p * 100;
        advance(); continue;
      }
      const A = getOffer(state.q.a), B = getOffer(state.q.b);
      const y = Math.random() < sig(tScore(A, state.q.brand) - tScore(B, state.q.brand)) ? 1 : 0;
      state.answers.push({a: state.q.a, b: state.q.b, y, brand: state.q.brand}); advance();
    }
    const {w} = model(true), risk = fitRisk();
    const ratio = i => +(w[i] / w[I_PAY]).toFixed(2), tRatio = i => +(T[i] / T[I_PAY]).toFixed(2);
    out['trial' + trial] = {
      answers: state.answers.length, riskScenarios: state.risk.length,
      nycMinusSea_perPay: [ratio(I_REG + 3) - ratio(I_REG + 1), tRatio(I_REG + 3) - tRatio(I_REG + 1)],
      tier_perPay: [ratio(I_TIER), tRatio(I_TIER)],
      rank_perPay: [ratio(I_RANK), tRatio(I_RANK)],
      ai_perPay: [ratio(I_SEC + 1), tRatio(I_SEC + 1)],
      riskR: [risk && +risk.r.toFixed(2), trueR, riskLabel(risk && risk.r)],
      flips: stressTest().filter(s => s.flipped).length,
    };
  }
  state = freshState(); refreshPool();
  return out;
}

if (location.hash === '#selftest') {
  localStorage.removeItem(STORE); localStorage.removeItem(OLD_STORE);
  const t0 = performance.now();
  const res = selfTest();
  res.ms = Math.round(performance.now() - t0);
  $('#selftest').textContent = 'SELFTEST ' + JSON.stringify(res);
  $('#selftest').style.display = 'block';
} else {
  if (state.phase !== 'intro' && state.phase !== 'done' && !state.q) advance();
  render();
}
</script>
